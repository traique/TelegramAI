[project]
name = "ai-assistant-platform"
version = "2.0.0"
description = "AI Assistant Platform for Telegram"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "aiogram>=3.20.0",
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "supabase>=2.16.0",
    "structlog>=25.4.0",
    "orjson>=3.11.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.20",
    "cachetools>=6.1.0",
    "tenacity>=9.1.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "ruff>=0.12.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
